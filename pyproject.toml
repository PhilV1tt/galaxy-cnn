[project]
name = "galaxy-cnn"
version = "0.1.0"
description = "Classification morphologique de galaxies (Galaxy10 DECaLS) par CNN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "datasets>=3.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false
